name: 新着を取得

on:
  schedule:
    - cron: "0 21 * * *"   # 毎朝 6:00 (日本時間)
  workflow_dispatch:        # GitHubアプリの「Run workflow」から手動でも実行できる

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: yt-dlp を最新版に
        run: pip install -U "yt-dlp[default]"

      - name: 新着を取得して公開
        env:
          GH_TOKEN: ${{ github.token }}
        run: python podcast.py update --limit 10 --keep 30

      - name: フィードを保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "エピソード更新 $(date +%F)"
          git push
